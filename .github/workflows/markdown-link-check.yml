name: Check Markdown links

on:
  push:
    branches: [ "main" ]
    paths:
      - "**.md"
      - ".github/scripts/prepare_markdown_links.py"
      - ".github/scripts/test_prepare_markdown_links.py"
      - ".github/workflows/markdown-link-check.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.md"
      - ".github/scripts/prepare_markdown_links.py"
      - ".github/scripts/test_prepare_markdown_links.py"
      - ".github/workflows/markdown-link-check.yml"

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve main-branch links against the proposed checkout
        run: |
          python3 -m unittest discover -s .github/scripts -p test_prepare_markdown_links.py
          python3 .github/scripts/prepare_markdown_links.py .

      - name: Markup Link Checker (mlc)
        uses: becheran/mlc@d791bd6ae91ea883f02172e21f453ba8da45dfcd # v1.3.0
        with:
          # Ignore DocFX cross-reference links (xref:) that mlc cannot check.
          # Ignore DocFX snippet inclusion links.
          # Do not warn for learn.microsoft.com locale redirects.
          # Do not warn for modelcontextprotocol.io homepage/spec redirects.
          args: >-
            --root-dir .
            --ignore-links "xref:*"
            --ignore-links "*samples/*?name=snippet_*"
            --do-not-warn-for-redirect-to "https://learn.microsoft.com/en-us/*"
            --do-not-warn-for-redirect-to "https://modelcontextprotocol.io/*"
            ./docs
